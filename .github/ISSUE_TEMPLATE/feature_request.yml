name: Feature request
description: Suggest a new tool, a change, or a missing capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and the group you are planning with. What is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The change you have in mind. Sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A new built-in tool
        - A change to an existing tool
        - The space, materials or conversation
        - Self-hosting and configuration
        - Something else
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
