name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish image and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Sofa
            org.opencontainers.image.description=Shared spaces where a group asks an AI to build the small tools it needs.
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --generate-notes --verify-tag $prerelease --title "Sofa $TAG"

  deploy:
    name: Deploy demo
    # Stable releases of this repository only; pre-releases (v1.2.0-rc.1) are not deployed.
    if: github.repository == 'sudoeren/sofa' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
      url: https://sofa.erencakar.com
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify deployment and wait for it
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_TOKEN is not set; skipping the deployment."
            exit 0
          fi
          api="$COOLIFY_URL/api/v1"
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          # Build exactly the released tag, not whatever master points at.
          curl -fsS -X PATCH "$api/applications/$COOLIFY_APP_UUID" -H "$auth" \
            -H "Content-Type: application/json" -d "{\"git_branch\":\"$TAG\"}" > /dev/null
          deployment=$(curl -fsS -X POST "$api/deploy?uuid=$COOLIFY_APP_UUID" -H "$auth" \
            | jq -r '.deployments[0].deployment_uuid')
          echo "Deployment $deployment queued"
          for _ in $(seq 1 120); do
            status=$(curl -fsS "$api/deployments/$deployment" -H "$auth" | jq -r '.status')
            case "$status" in
              finished) echo "Deployed"; break ;;
              failed|cancelled-by-user) echo "::error::Deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = finished ] || { echo "::error::Deployment did not finish in time"; exit 1; }
      - name: Check the live site
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            if curl -fsS https://sofa.erencakar.com/api/config > /dev/null; then echo "Live"; exit 0; fi
            sleep 5
          done
          echo "::error::The demo did not answer after deploying"
          exit 1
