services:
  sofa:
    image: ghcr.io/sudoeren/sofa:latest
    # or build from this checkout instead: comment out image and use
    # build: .
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    volumes:
      - sofa-data:/data
    restart: unless-stopped

volumes:
  sofa-data:
